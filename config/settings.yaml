# Config parameters for visual SKU allocation system v1
demand_estimation:
  decay_constant: 12  # roughly 1-year half-life for recency decay
  top_k: 20          # number of visually similar SKUs to search

pilot_scope:
  category: "T-Shirt"
  region: "Kerala"

similarity_search:
  calibration_percentile: 10.0  # percentile of colorway-sibling scores to set the floor
  soft_boost_damping: 0.20      # multiplier scaling down the soft attribute score boost
  soft_attributes:
    - SLEEVE_TYPE
    - CLOSURE
    - POCKET
    - STYLE
    - FABRIC_WEIGHT
    - COMPOSITION
    - OCCASSION_NEW
    - FIT

